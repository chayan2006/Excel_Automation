<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Workbooks{% endblock %} · Excel Control Room</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell operation-shell">
    <a class="back-link" href="{{ url_for('dashboard') }}">← Back to control room</a>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</body>
</html>
